name: build-binaries

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
            binary: dist/sc61box.exe
          - os: windows-11-arm
            name: windows-arm64
            binary: dist/sc61box.exe
          - os: macos-latest
            name: macos-arm64
            binary: dist/sc61box
          - os: ubuntu-latest
            name: linux-amd64
            binary: dist/sc61box
          - os: ubuntu-26.04-arm
            name: linux-arm64
            binary: dist/sc61box

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync --dev

      - name: Build executable with PyInstaller
        run: uv run pyinstaller sc61box.spec --noconfirm

      - name: Ensure executable bit
        if: runner.os != 'Windows'
        run: chmod +x ${{ matrix.binary }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sc61box-${{ matrix.name }}
          path: ${{ matrix.binary }}
