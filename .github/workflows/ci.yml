# CIにはROMを置かないので、ROMを使う試験は飛ばし、CPUコアの試験と静的な検査だけを行う。
name: ci

on:
  push:
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2  # setup-uvは「v10」のような版の頭だけのタグを出していない
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uvx pyrefly@1.4.0 check  # 版を決めておく(新しい版で検査が増えて急に落ちないように)
      - run: uv run pytest -q tests
